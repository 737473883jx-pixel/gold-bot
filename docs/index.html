<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gold Bot Control</title>

<style>
html,body{
  margin:0;
  height:100%;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.box{
  width:min(92vw,420px);
  text-align:center;
}

button{
  width:100%;
  padding:22px;
  margin:10px 0;
  border:0;
  border-radius:14px;
  font-size:24px;
  font-weight:700;
  color:#fff;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

#start{
  background:#16a34a;
}

#stop{
  background:#dc2626;
}

#status{
  margin-top:18px;
  font-size:20px;
  font-weight:700;
}
</style>
</head>

<body>

<div class="box">

  <button id="start">START</button>

  <button id="stop">STOP</button>

  <div id="status">STATUS: CHECKING...</div>

</div>

<script>

const API_BASE =
  "https://round-truth-3ef9.737473883jx.workers.dev";

const statusEl =
  document.getElementById("status");

const startBtn =
  document.getElementById("start");

const stopBtn =
  document.getElementById("stop");


async function call(path, method = "GET") {

  const response = await fetch(
    API_BASE + path,
    {
      method: method,
      headers: {
        "Accept": "application/json"
      }
    }
  );

  let data = {};

  try {
    data = await response.json();
  } catch (e) {
    data = {};
  }

  if (!response.ok) {
    throw new Error(
      data.error || ("HTTP " + response.status)
    );
  }

  return data;
}


function showState(state) {

  const s =
    String(state || "").toUpperCase();

  if (s === "AVAILABLE") {

    statusEl.textContent =
      "STATUS: CONNECTED";

    statusEl.style.color =
      "#22c55e";

  } else if (
    s === "STARTING" ||
    s === "CREATING" ||
    s === "STARTED"
  ) {

    statusEl.textContent =
      "STATUS: CONNECTING...";

    statusEl.style.color =
      "#f59e0b";

  } else if (
    s === "SHUTDOWN" ||
    s === "STOPPED" ||
    s === "STOPPING" ||
    s === "SHUTTING_DOWN"
  ) {

    statusEl.textContent =
      "STATUS: DISCONNECTED";

    statusEl.style.color =
      "#ef4444";

  } else {

    statusEl.textContent =
      "STATUS: " + (s || "UNKNOWN");

    statusEl.style.color =
      "#fff";
  }

  return s;
}


async function checkStatus() {

  try {

    const data =
      await call("/status");

    return showState(data.state);

  } catch (error) {

    statusEl.textContent =
      "STATUS: CONNECTION ERROR";

    statusEl.style.color =
      "#f59e0b";

    return "ERROR";
  }
}


async function control(action) {

  startBtn.disabled = true;
  stopBtn.disabled = true;

  if (action === "start") {

    statusEl.textContent =
      "STATUS: STARTING...";

  } else {

    statusEl.textContent =
      "STATUS: STOPPING...";
  }

  statusEl.style.color =
    "#f59e0b";

  try {

    const result =
      await call("/" + action, "POST");

    if (!result.ok) {
      throw new Error(
        result.error || "Action failed"
      );
    }

    /*
      GitHub Codespaces takes a little time
      to change state, so check repeatedly.
    */

    for (let i = 0; i < 30; i++) {

      await new Promise(
        resolve => setTimeout(resolve, 2000)
      );

      const state =
        await checkStatus();

      if (
        action === "start" &&
        state === "AVAILABLE"
      ) {
        break;
      }

      if (
        action === "stop" &&
        (
          state === "SHUTDOWN" ||
          state === "STOPPED"
        )
      ) {
        break;
      }
    }

  } catch (error) {

    statusEl.textContent =
      "STATUS: ACTION FAILED";

    statusEl.style.color =
      "#ef4444";

  } finally {

    startBtn.disabled = false;
    stopBtn.disabled = false;
  }
}


startBtn.addEventListener(
  "click",
  () => control("start")
);


stopBtn.addEventListener(
  "click",
  () => control("stop")
);


/*
  Check current Codespace state
  when the dashboard opens.
*/

checkStatus();


/*
  Keep the status updated automatically.
*/

setInterval(
  checkStatus,
  10000
);

</script>

</body>
</html>
