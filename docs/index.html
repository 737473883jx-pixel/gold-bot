<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codespace Control</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0f172a;
  color:#f8fafc;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  width:100%;
  max-width:380px;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  font-size:24px;
  margin:0 0 22px;
}

.status-box{
  text-align:center;
  padding:18px;
  border-radius:12px;
  background:#0f172a;
  margin-bottom:18px;
  font-size:18px;
}

#statusText{
  font-weight:bold;
}

button{
  width:100%;
  padding:16px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.start{
  background:#22c55e;
  color:#052e16;
}

.stop{
  background:#ef4444;
  color:white;
}

.message{
  text-align:center;
  margin-top:18px;
  min-height:28px;
  font-size:16px;
  font-weight:bold;
}

.success{
  color:#22c55e;
}

.working{
  color:#fbbf24;
}

.error{
  color:#ef4444;
}
</style>
</head>

<body>

<div class="box">

<h1>Codespace Control</h1>

<div class="status-box">
  STATUS:
  <span id="statusText">CHECKING...</span>
</div>

<button class="start" id="startBtn">
  START
</button>

<button class="stop" id="stopBtn">
  STOP
</button>

<div class="message" id="message">
  অবস্থা পরীক্ষা করা হচ্ছে...
</div>

</div>

<script>

const WORKER_URL =
"https://round-truth-3ef9.737473883jx.workers.dev";

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const statusText =
document.getElementById("statusText");

const message =
document.getElementById("message");


function setStatus(state){

  const value =
  String(state || "").toUpperCase();

  if(value === "RUNNING"){

    statusText.textContent =
    "RUNNING";

    statusText.style.color =
    "#22c55e";

  }

  else if(
    value === "STOPPED" ||
    value === "SHUTDOWN" ||
    value === "OFF"
  ){

    statusText.textContent =
    "STOPPED";

    statusText.style.color =
    "#ef4444";

  }

  else if(
    value === "STARTING" ||
    value === "STOPPING"
  ){

    statusText.textContent =
    value;

    statusText.style.color =
    "#fbbf24";

  }

  else{

    statusText.textContent =
    value || "UNKNOWN";

    statusText.style.color =
    "#fbbf24";
  }
}


function showMessage(text,type){

  message.textContent =
  text;

  message.className =
  "message " + type;
}


async function fetchStatus(){

  try{

    const response =
    await fetch(
      WORKER_URL + "/status",
      {
        method:"GET",
        cache:"no-store"
      }
    );

    const data =
    await response.json();

    if(
      !response.ok ||
      data.ok === false
    ){

      setStatus("UNKNOWN");

      showMessage(
        data.error ||
        "স্ট্যাটাস পাওয়া যাচ্ছে না",
        "error"
      );

      return;
    }

    setStatus(data.state);

    const state =
    String(
      data.state || ""
    ).toUpperCase();

    if(state === "RUNNING"){

      showMessage(
        "চালু হয়েছে ✓",
        "success"
      );

    }

    else if(
      state === "SHUTDOWN" ||
      state === "STOPPED" ||
      state === "OFF"
    ){

      showMessage(
        "স্টপ হয়ে গেছে ✓",
        "success"
      );

    }

    else if(state === "STARTING"){

      showMessage(
        "চালু হচ্ছে...",
        "working"
      );

    }

    else if(state === "STOPPING"){

      showMessage(
        "বন্ধ হচ্ছে...",
        "working"
      );

    }

  }

  catch(error){

    setStatus("UNKNOWN");

    showMessage(
      "Worker-এর সাথে সংযোগ হচ্ছে না",
      "error"
    );
  }
}


async function control(action){

  startBtn.disabled =
  true;

  stopBtn.disabled =
  true;


  if(action === "start"){

    showMessage(
      "চালু করার অনুরোধ পাঠানো হয়েছে... চালু হচ্ছে...",
      "working"
    );

    setStatus("STARTING");

  }

  else{

    showMessage(
      "বন্ধ করার অনুরোধ পাঠানো হয়েছে... বন্ধ হচ্ছে...",
      "working"
    );

    setStatus("STOPPING");
  }


  try{

    const response =
    await fetch(
      WORKER_URL + "/" + action,
      {
        method:"POST"
      }
    );

    const data =
    await response.json();


    if(
      !response.ok ||
      data.ok === false
    ){

      showMessage(
        data.error ||
        "কাজটি করা যায়নি",
        "error"
      );

      await fetchStatus();

      return;
    }


    if(action === "start"){

      showMessage(
        "চালু হচ্ছে... একটু অপেক্ষা করো",
        "working"
      );

    }

    else{

      showMessage(
        "বন্ধ হচ্ছে... একটু অপেক্ষা করো",
        "working"
      );
    }


    /*
      Codespace পুরোপুরি চালু/বন্ধ হওয়া
      পর্যন্ত বারবার স্ট্যাটাস পরীক্ষা করবে।
    */

    let attempts = 0;

    const check = async () => {

      attempts++;

      await fetchStatus();


      const current =
      statusText.textContent;


      if(action === "start"){

        if(current === "RUNNING"){

          showMessage(
            "চালু হয়েছে ✓",
            "success"
          );

          startBtn.disabled =
          false;

          stopBtn.disabled =
          false;

          return;
        }

      }

      else{

        if(current === "STOPPED"){

          showMessage(
            "স্টপ হয়ে গেছে ✓",
            "success"
          );

          startBtn.disabled =
          false;

          stopBtn.disabled =
          false;

          return;
        }
      }


      if(attempts < 20){

        setTimeout(
          check,
          3000
        );

      }

      else{

        showMessage(
          action === "start"
          ? "চালু হতে বেশি সময় লাগছে। আবার STATUS দেখছি..."
          : "বন্ধ হতে বেশি সময় লাগছে। আবার STATUS দেখছি...",
          "working"
        );

        startBtn.disabled =
        false;

        stopBtn.disabled =
        false;

        setTimeout(
          fetchStatus,
          5000
        );
      }
    };


    setTimeout(
      check,
      3000
    );

  }

  catch(error){

    showMessage(
      "Worker-এর সাথে সংযোগ হচ্ছে না",
      "error"
    );

    await fetchStatus();

    startBtn.disabled =
    false;

    stopBtn.disabled =
    false;
  }
}


startBtn.addEventListener(
  "click",
  () => control("start")
);


stopBtn.addEventListener(
  "click",
  () => control("stop")
);


fetchStatus();


setInterval(
  fetchStatus,
  10000
);

</script>

</body>
</html>
