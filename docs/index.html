<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codespace Control</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0f172a;
  color: #f8fafc;
  font-family: Arial, sans-serif;
  padding: 20px;
}

.box {
  width: 100%;
  max-width: 380px;
  background: #1e293b;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

h1 {
  text-align: center;
  font-size: 24px;
  margin: 0 0 22px;
}

.status-box {
  text-align: center;
  padding: 15px;
  border-radius: 12px;
  background: #0f172a;
  margin-bottom: 18px;
  font-size: 18px;
}

#statusText {
  font-weight: bold;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.start {
  background: #22c55e;
  color: #052e16;
}

.stop {
  background: #ef4444;
  color: white;
}

.message {
  text-align: center;
  margin-top: 16px;
  min-height: 22px;
  color: #cbd5e1;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="box">

  <h1>Codespace Control</h1>

  <div class="status-box">
    STATUS:
    <span id="statusText">CHECKING...</span>
  </div>

  <button class="start" id="startBtn">
    START
  </button>

  <button class="stop" id="stopBtn">
    STOP
  </button>

  <div class="message" id="message"></div>

</div>

<script>

const WORKER_URL =
"https://round-truth-3ef9.737473883jx.workers.dev";

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const statusText =
document.getElementById("statusText");

const message =
document.getElementById("message");


function setStatus(state) {

  const value =
  String(state || "").toUpperCase();

  if (value === "RUNNING") {

    statusText.textContent = "RUNNING";
    statusText.style.color = "#22c55e";

  } else if (
    value === "STOPPED" ||
    value === "SHUTDOWN" ||
    value === "OFF"
  ) {

    statusText.textContent = "STOPPED";
    statusText.style.color = "#ef4444";

  } else if (
    value === "STARTING" ||
    value === "STOPPING"
  ) {

    statusText.textContent = value;
    statusText.style.color = "#fbbf24";

  } else {

    statusText.textContent =
    value || "UNKNOWN";

    statusText.style.color = "#fbbf24";
  }
}


async function fetchStatus() {

  try {

    const response =
    await fetch(
      WORKER_URL + "/status",
      {
        method: "GET",
        cache: "no-store"
      }
    );

    const data =
    await response.json();

    if (
      !response.ok ||
      data.ok === false
    ) {

      setStatus("UNKNOWN");

      message.textContent =
      data.error ||
      "Status পাওয়া যাচ্ছে না";

      return;
    }

    setStatus(data.state);

    message.textContent = "";

  } catch (error) {

    setStatus("UNKNOWN");

    message.textContent =
    "Worker-এর সাথে সংযোগ হচ্ছে না";
  }
}


async function control(action) {

  startBtn.disabled = true;
  stopBtn.disabled = true;

  if (action === "start") {

    message.textContent =
    "চালু করার অনুরোধ পাঠানো হচ্ছে...";

  } else {

    message.textContent =
    "বন্ধ করার অনুরোধ পাঠানো হচ্ছে...";
  }


  try {

    const response =
    await fetch(
      WORKER_URL + "/" + action,
      {
        method: "POST"
      }
    );

    const data =
    await response.json();


    if (
      !response.ok ||
      data.ok === false
    ) {

      message.textContent =
      data.error ||
      "কাজটি করা যায়নি";

      await fetchStatus();

      return;
    }


    if (action === "start") {

      message.textContent =
      "চালু করার অনুরোধ পাঠানো হয়েছে";

    } else {

      message.textContent =
      "বন্ধ করার অনুরোধ পাঠানো হয়েছে";
    }


    setTimeout(
      fetchStatus,
      3000
    );

    setTimeout(
      fetchStatus,
      7000
    );


  } catch (error) {

    message.textContent =
    "Worker-এর সাথে সংযোগ হচ্ছে না";

  } finally {

    setTimeout(
      function() {

        startBtn.disabled = false;
        stopBtn.disabled = false;

      },
      5000
    );
  }
}


startBtn.addEventListener(
  "click",
  function() {
    control("start");
  }
);


stopBtn.addEventListener(
  "click",
  function() {
    control("stop");
  }
);


fetchStatus();


setInterval(
  fetchStatus,
  10000
);

</script>

</body>
</html>
