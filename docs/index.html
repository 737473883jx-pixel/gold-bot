<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gold Bot Control</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0f172a;
  color:#f8fafc;
  font-family:Arial,sans-serif;
  padding:20px;
}

.box{
  width:100%;
  max-width:380px;
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

h1{
  text-align:center;
  margin:0 0 25px;
  font-size:25px;
}

.connection{
  text-align:center;
  background:#0f172a;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}

.connection-title{
  font-size:14px;
  color:#94a3b8;
  margin-bottom:8px;
}

#connectionText{
  font-size:25px;
  font-weight:bold;
}

.result{
  text-align:center;
  min-height:35px;
  margin:15px 0;
  font-size:17px;
  font-weight:bold;
}

button{
  width:100%;
  padding:17px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.start{
  background:#22c55e;
  color:#052e16;
}

.stop{
  background:#ef4444;
  color:white;
}

.connected{
  color:#22c55e;
}

.disconnected{
  color:#ef4444;
}

.working{
  color:#fbbf24;
}

.error{
  color:#ef4444;
}

</style>
</head>

<body>

<div class="box">

<h1>Gold Bot Control</h1>

<div class="connection">

  <div class="connection-title">
    CONNECTION
  </div>

  <div id="connectionText" class="disconnected">
    DISCONNECTED
  </div>

</div>

<button
  class="start"
  id="startBtn">
  START
</button>

<button
  class="stop"
  id="stopBtn">
  STOP
</button>

<div
  id="result"
  class="result">
</div>

</div>

<script>

const WORKER_URL =
"https://round-truth-3ef9.737473883jx.workers.dev";

const startBtn =
document.getElementById("startBtn");

const stopBtn =
document.getElementById("stopBtn");

const connectionText =
document.getElementById("connectionText");

const result =
document.getElementById("result");


function setConnection(state){

  const value =
  String(state || "").toUpperCase();

  if(
    value === "RUNNING"
  ){

    connectionText.textContent =
    "CONNECTED ✓";

    connectionText.className =
    "connected";

  }

  else if(
    value === "SHUTDOWN" ||
    value === "STOPPED" ||
    value === "OFF"
  ){

    connectionText.textContent =
    "DISCONNECTED";

    connectionText.className =
    "disconnected";

  }

  else if(
    value === "STARTING"
  ){

    connectionText.textContent =
    "CONNECTING...";

    connectionText.className =
    "working";

  }

  else if(
    value === "STOPPING"
  ){

    connectionText.textContent =
    "DISCONNECTING...";

    connectionText.className =
    "working";

  }

  else{

    connectionText.textContent =
    "UNKNOWN";

    connectionText.className =
    "working";
  }

}


function showResult(text,type){

  result.textContent =
  text;

  result.className =
  "result " + type;
}


async function getStatus(){

  try{

    const response =
    await fetch(
      WORKER_URL + "/status",
      {
        method:"GET",
        cache:"no-store"
      }
    );

    const data =
    await response.json();

    if(
      !response.ok ||
      data.ok === false
    ){

      setConnection("UNKNOWN");

      return;
    }

    setConnection(data.state);

  }

  catch(error){

    setConnection("UNKNOWN");

  }

}


async function control(action){

  startBtn.disabled =
  true;

  stopBtn.disabled =
  true;


  if(action === "start"){

    setConnection("STARTING");

    showResult(
      "CONNECTING... চালু হচ্ছে",
      "working"
    );

  }

  else{

    setConnection("STOPPING");

    showResult(
      "DISCONNECTING... বন্ধ হচ্ছে",
      "working"
    );

  }


  try{

    const response =
    await fetch(
      WORKER_URL + "/" + action,
      {
        method:"POST"
      }
    );

    const data =
    await response.json();


    if(
      !response.ok ||
      data.ok === false
    ){

      showResult(
        action === "start"
        ? "CONNECT FAILED ✕"
        : "DISCONNECT FAILED ✕",
        "error"
      );

      await getStatus();

      startBtn.disabled =
      false;

      stopBtn.disabled =
      false;

      return;
    }


    /*
      GitHub Codespace চালু/বন্ধ হওয়া
      পর্যন্ত প্রতি 3 সেকেন্ডে পরীক্ষা করবে।
    */

    let attempts = 0;


    async function waitForFinalState(){

      attempts++;

      const response =
      await fetch(
        WORKER_URL + "/status",
        {
          method:"GET",
          cache:"no-store"
        }
      );

      const data =
      await response.json();


      if(
        response.ok &&
        data.ok
      ){

        const state =
        String(
          data.state || ""
        ).toUpperCase();


        if(
          action === "start" &&
          state === "RUNNING"
        ){

          setConnection("RUNNING");

          showResult(
            "CONNECTED ✓  চালু হয়েছে",
            "connected"
          );

          startBtn.disabled =
          false;

          stopBtn.disabled =
          false;

          return;
        }


        if(
          action === "stop" &&
          (
            state === "SHUTDOWN" ||
            state === "STOPPED" ||
            state === "OFF"
          )
        ){

          setConnection("STOPPED");

          showResult(
            "DISCONNECTED ✓  স্টপ হয়ে গেছে",
            "disconnected"
          );

          startBtn.disabled =
          false;

          stopBtn.disabled =
          false;

          return;
        }


        setConnection(state);

      }


      if(attempts < 20){

        setTimeout(
          waitForFinalState,
          3000
        );

      }

      else{

        showResult(
          action === "start"
          ? "চালু হতে একটু বেশি সময় লাগছে..."
          : "বন্ধ হতে একটু বেশি সময় লাগছে...",
          "working"
        );

        startBtn.disabled =
        false;

        stopBtn.disabled =
        false;
      }

    }


    setTimeout(
      waitForFinalState,
      3000
    );


  }

  catch(error){

    showResult(
      action === "start"
      ? "CONNECT FAILED ✕"
      : "DISCONNECT FAILED ✕",
      "error"
    );

    await getStatus();

    startBtn.disabled =
    false;

    stopBtn.disabled =
    false;
  }

}


startBtn.addEventListener(
  "click",
  () => control("start")
);


stopBtn.addEventListener(
  "click",
  () => control("stop")
);


/*
  Page খুললেই বর্তমান অবস্থা দেখাবে।
*/

getStatus();


/*
  প্রতি 10 সেকেন্ডে অবস্থা আপডেট করবে।
*/

setInterval(
  getStatus,
  10000
);

</script>

</body>
</html>
